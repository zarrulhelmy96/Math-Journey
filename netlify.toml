[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Public homepage and clean application URL. Keep API routes untouched.
[[redirects]]
  from = "/login/"
  to = "/login"
  status = 301
  force = true

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/index.html"
  to = "/login"
  status = 302
  force = true

[[redirects]]
  from = "/landing.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/landing"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/"
  to = "/landing.html"
  status = 200
  force = true

[[headers]]
  for = "/login"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
