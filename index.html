<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Journey - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>.hide { display: none !important; }</style>
</head>
<body class="bg-slate-50 font-sans">

    <main class="max-w-md mx-auto min-h-screen bg-white shadow-xl p-5">
        
        <section id="view-admin">
            <div class="mb-6">
                <h2 class="text-xl font-bold text-purple-900">Admin Panel (Content Manager)</h2>
                <p class="text-xs text-gray-500">Urus, edit, atau padam kandungan subtopik.</p>
            </div>

            <div class="bg-white border border-purple-100 p-4 rounded-xl mb-6 shadow-sm">
                <h3 class="font-bold text-sm text-purple-800 mb-3"><i class="fa-solid fa-database"></i> Senarai Kandungan Sedia Ada</h3>
                <select id="adm-content-list" class="w-full border p-2 rounded text-xs bg-gray-50 mb-3" onchange="loadContentToForm()">
                    <option value="">-- Pilih kandungan untuk edit/padam --</option>
                </select>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="refreshContentList()" class="bg-blue-600 text-white font-bold py-2 rounded text-xs">Refresh List</button>
                    <button onclick="deleteSelectedContent()" class="bg-red-600 text-white font-bold py-2 rounded text-xs">Padam Dipilih</button>
                </div>
            </div>

            <div class="bg-white border border-gray-200 p-4 rounded-xl space-y-3 text-xs">
                <h3 class="font-bold text-sm text-slate-800 border-b pb-2">Ubah / Tambah Kandungan</h3>
                
                <input type="number" id="adm-form" placeholder="Tingkatan (1-5)" class="w-full border p-2 rounded">
                <input type="text" id="adm-chapter" class="w-full border p-2 rounded" placeholder="Nama Bab (contoh: Matematik_Pengguna)">
                <input type="text" id="adm-subtopic" class="w-full border p-2 rounded" placeholder="Nama Subtopik (contoh: Faedah_Mudah)">
                
                <div class="bg-slate-50 p-3 rounded space-y-2 border">
                    <p class="font-bold text-[11px] text-purple-700">Nota Ringkas</p>
                    <textarea id="adm-nota-maksud" rows="2" class="w-full border p-2 rounded" placeholder="Maksud..."></textarea>
                    <input type="text" id="adm-nota-formula" class="w-full border p-2 rounded" placeholder="Formula">
                    <textarea id="adm-nota-kesilapan" rows="2" class="w-full border p-2 rounded" placeholder="Kesilapan..."></textarea>
                    <textarea id="adm-nota-tips" rows="2" class="w-full border p-2 rounded" placeholder="Tips..."></textarea>
                </div>

                <div class="bg-amber-50 p-3 rounded space-y-2 border">
                    <p class="font-bold text-[11px] text-amber-700">Contoh Soalan & Langkah</p>
                    <textarea id="adm-contoh-soalan" rows="2" class="w-full border p-2 rounded" placeholder="Soalan..."></textarea>
                    <textarea id="adm-contoh-jalan" rows="3" class="w-full border p-2 rounded" placeholder="Jalan kerja..."></textarea>
                </div>

                <button onclick="saveContentToFirebase()" class="w-full bg-purple-700 text-white font-bold p-3 rounded-xl">Simpan ke Firebase</button>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCsFCvkBLuLHzUVGokE82jRWshbsTsavVI",
            databaseURL: "https://math-journey-2fd87-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // FUNGSI LOAD SENARAI DARI FIREBASE
        window.refreshContentList = function() {
            const listSelect = document.getElementById('adm-content-list');
            listSelect.innerHTML = '<option value="">-- Pilih kandungan untuk edit/padam --</option>';
            
            get(ref(db, 'silibus')).then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    for(let form in data) {
                        for(let bab in data[form]) {
                            for(let sub in data[form][bab].subtopik) {
                                let content = data[form][bab].subtopik[sub];
                                let option = document.createElement('option');
                                option.value = `${form}|${bab}|${sub}`;
                                option.innerText = `[T${form}] ${bab.replace(/_/g, ' ')} > ${content.nama}`;
                                listSelect.appendChild(option);
                            }
                        }
                    }
                }
            });
        };

        // FUNGSI ISI BORANG BILA ITEM DIPILIH
        window.loadContentToForm = function() {
            const val = document.getElementById('adm-content-list').value;
            if(!val) return;
            const [form, bab, sub] = val.split('|');
            
            get(ref(db, `silibus/${form}/${bab}/subtopik/${sub}`)).then((snapshot) => {
                const data = snapshot.val();
                document.getElementById('adm-form').value = form;
                document.getElementById('adm-chapter').value = bab;
                document.getElementById('adm-subtopic').value = sub;
                document.getElementById('adm-nota-maksud').value = data.nota?.maksud || '';
                document.getElementById('adm-nota-formula').value = data.nota?.formula || '';
                document.getElementById('adm-nota-kesilapan').value = data.nota?.kesilapan || '';
                document.getElementById('adm-nota-tips').value = data.nota?.tips || '';
                document.getElementById('adm-contoh-soalan').value = data.contoh?.soalan || '';
                document.getElementById('adm-contoh-jalan').value = data.contoh?.jalan_kerja || '';
            });
        };

        // FUNGSI PADAM ITEM TERPILIH
        window.deleteSelectedContent = function() {
            const val = document.getElementById('adm-content-list').value;
            if(!val) return alert("Sila pilih item!");
            const [form, bab, sub] = val.split('|');
            
            if(confirm("Adakah anda pasti mahu memadam kandungan ini?")) {
                set(ref(db, `silibus/${form}/${bab}/subtopik/${sub}`), null).then(() => {
                    alert("Berjaya dipadam!");
                    refreshContentList();
                });
            }
        };

        // FUNGSI SIMPAN
        window.saveContentToFirebase = function() {
            const form = document.getElementById('adm-form').value;
            const bab = document.getElementById('adm-chapter').value.trim();
            const sub = document.getElementById('adm-subtopic').value.trim();
            
            const payload = {
                nama: sub,
                nota: {
                    maksud: document.getElementById('adm-nota-maksud').value,
                    formula: document.getElementById('adm-nota-formula').value,
                    kesilapan: document.getElementById('adm-nota-kesilapan').value,
                    tips: document.getElementById('adm-nota-tips').value,
                },
                contoh: {
                    soalan: document.getElementById('adm-contoh-soalan').value,
                    jalan_kerja: document.getElementById('adm-contoh-jalan').value,
                }
            };

            update(ref(db, `silibus/${form}/${bab}/subtopik/${sub}`), payload).then(() => {
                alert("Berjaya disimpan!");
                refreshContentList();
            });
        };

        // Auto-refresh semasa load
        refreshContentList();
    </script>
</body>
</html>
