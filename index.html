<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Journey - Belajar Matematik Langkah demi Langkah</title>
    <script src="https://cdn.tailwindcss.com\"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FAF8F5;
        }
        .bg-soft-pink { background-color: #FFF0F2; }
        .text-soft-pink { color: #FF6B8B; }
        .border-soft-pink { border-color: #FFB3C1; }
        .bg-neon-green { background-color: #E8FAD4; }
        .text-neon-green { color: #52B710; }
        .btn-primary {
            background-color: #FF6B8B;
            color: white;
        }
        .hide { display: none !important; }
    </style>
</head>
<body>

    <div id="app-container" class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between pb-24">
        <div id="user-content-area" class="p-4 space-y-4">
            </div>
    </div>

    <div id="admin-panel-section" class="max-w-md mx-auto bg-gray-100 p-4 border-t-2 border-gray-300 mt-10 rounded-t-3xl">
        <h2 class="text-xl font-bold text-gray-800 mb-4"><i class="fa-solid fa-user-gear mr-2"></i>Admin Panel MathJourney</h2>
        
        <div class="space-y-3 bg-white p-4 rounded-2xl shadow-sm">
            <div>
                <label class="block font-semibold text-gray-600 mb-1">Tingkatan</label>
                <select id="adm-form" class="w-full border p-2 rounded-lg focus:outline-none">
                    <option value="1">Tingkatan 1</option>
                    <option value="2">Tingkatan 2</option>
                    <option value="3">Tingkatan 3</option>
                    <option value="4">Tingkatan 4</option>
                    <option value="5">Tingkatan 5</option>
                </select>
            </div>

            <div>
                <label class="block font-semibold text-gray-600 mb-1">Pilih Bab</label>
                <select id="adm-chapter-select" class="w-full border p-2 rounded-lg focus:outline-none"></select>
            </div>

            <div>
                <label class="block font-semibold text-gray-600 mb-1">Pilih Subtopik</label>
                <select id="adm-subtopic-select" class="w-full border p-2 rounded-lg focus:outline-none"></select>
            </div>

            <div>
                <label class="block font-semibold text-gray-600 mb-1">Jenis Kandungan Baru</label>
                <select id="adm-content-type" onchange="toggleAdminContentFields()" class="w-full border p-2 rounded-lg focus:outline-none bg-yellow-50 font-medium">
                    <option value="nota">Nota Ringkas</option>
                    <option value="contoh">Contoh Jalan Kerja</option>
                    <option value="latihan">Soalan Latihan Interaktif</option>
                    <option value="kuiz">Kuiz Bab</option>
                </select>
            </div>

            <div id="fields-nota" class="space-y-3">
                <div>
                    <label class="block font-semibold text-gray-600 mb-1">Maksud / Definisi</label>
                    <textarea id="adm-nota-maksud" rows="2" class="w-full border p-2 rounded-lg focus:outline-none"></textarea>
                </div>
                <div>
                    <label class="block font-semibold text-gray-600 mb-1">Formula Terkait</label>
                    <textarea id="adm-nota-formula" rows="2" class="w-full border p-2 rounded-lg focus:outline-none"></textarea>
                </div>
                <div>
                    <label class="block font-semibold text-gray-600 mb-1">Kesilapan Lazim</label>
                    <textarea id="adm-nota-kesilapan" rows="2" class="w-full border p-2 rounded-lg focus:outline-none"></textarea>
                </div>
                <div>
                    <label class="block font-semibold text-gray-600 mb-1">Tips & Trik</label>
                    <textarea id="adm-nota-tips" rows="2" class="w-full border p-2 rounded-lg focus:outline-none"></textarea>
                </div>
                <div>
                    <label class="block font-semibold text-gray-600 mb-1">Gambar Nota Ringkas</label>
                    <input type="file" id="adm-nota-image-file" accept="image/jpeg, image/png, image/webp" multiple class="w-full border p-2 rounded-lg text-xs bg-gray-50">
                    <p class="text-[10px] text-gray-400 mt-1">Boleh muat naik lebih daripada satu gambar untuk nota ringkas.</p>
                </div>
            </div>

            <div id="fields-contoh" class="space-y-3 hide">
                <div>
                    <label class="block font-semibold text-gray-600 mb-1">Soalan Contoh Kerja</label>
                    <textarea id="adm-contoh-soalan" rows="2" class="w-full border p-2 rounded-lg focus:outline-none"></textarea>
                </div>
                <div>
                    <label class="block font-semibold text-gray-600 mb-1">Langkah Demi Langkah</label>
                    <textarea id="adm-contoh-langkah" rows="4" class="w-full border p-2 rounded-lg focus:outline-none" placeholder="Langkah 1...\nLangkah 2..."></textarea>
                </div>
                <div>
                    <label class="block font-semibold text-gray-600 mb-1">Gambar Contoh Jalan Kerja</label>
                    <input type="file" id="adm-contoh-image-file" accept="image/jpeg, image/png, image/webp" multiple class="w-full border p-2 rounded-lg text-xs bg-gray-50">
                    <p class="text-[10px] text-gray-400 mt-1">Boleh muat naik lebih daripada satu gambar untuk contoh jalan kerja.</p>
                </div>
            </div>

            <div id="fields-latihan" class="space-y-3 hide">
                <div>
                    <label class="block font-semibold text-gray-600 mb-1">Soalan Latihan Interaktif</label>
                    <textarea id="adm-latihan-soalan" rows="2" class="w-full border p-2 rounded-lg focus:outline-none"></textarea>
                </div>
                <div>
                    <label class="block font-semibold text-gray-600 mb-1">Gambar Soalan Latihan</label>
                    <input type="file" id="adm-latihan-image-file" accept="image/jpeg, image/png, image/webp" multiple class="w-full border p-2 rounded-lg text-xs bg-gray-50">
                    <p class="text-[10px] text-gray-400 mt-1">Boleh muat naik lebih daripada satu gambar untuk soalan latihan.</p>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-semibold text-[11px] text-gray-500 mb-1">Pilihan A</label>
                        <input type="text" id="adm-latihan-a" class="w-full border p-2 rounded-lg focus:outline-none">
                    </div>
                    <div>
                        <label class="block font-semibold text-[11px] text-gray-500 mb-1">Pilihan B</label>
                        <input type="text" id="adm-latihan-b" class="w-full border p-2 rounded-lg focus:outline-none">
                    </div>
                    <div>
                        <label class="block font-semibold text-[11px] text-gray-500 mb-1">Pilihan C</label>
                        <input type="text" id="adm-latihan-c" class="w-full border p-2 rounded-lg focus:outline-none">
                    </div>
                    <div>
                        <label class="block font-semibold text-[11px] text-gray-500 mb-1">Pilihan D</label>
                        <input type="text" id="adm-latihan-d" class="w-full border p-2 rounded-lg focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block font-semibold text-gray-600 mb-1">Jawapan Betul (A / B / C / D)</label>
                    <input type="text" id="adm-latihan-jawapan" placeholder="Contoh: A" class="w-full border p-2.5 rounded-lg focus:outline-none uppercase font-bold tracking-wider max-w-[100px]">
                </div>
                <div>
                    <label class="block font-semibold text-gray-600 mb-1">Penerangan Jawapan Latihan</label>
                    <textarea id="adm-latihan-penerangan" rows="2" class="w-full border p-2 rounded-lg focus:outline-none" placeholder="Terangkan rujukan ralat/jawapan betul..."></textarea>
                </div>
            </div>

            <div id="fields-kuiz" class="space-y-3 hide">
                <div>
                    <label class="block font-semibold text-gray-600 mb-1">Soalan Kuiz Bab</label>
                    <textarea id="adm-kuiz-soalan" rows="2" class="w-full border p-2 rounded-lg focus:outline-none" placeholder="Taip soalan kuiz bab..."></textarea>
                </div>

                <div>
                    <label class="block font-semibold text-gray-600 mb-1">Gambar Soalan Kuiz</label>
                    <input type="file" id="adm-kuiz-image-file" accept="image/jpeg, image/png, image/webp" multiple class="w-full border p-2 rounded-lg text-xs bg-gray-50">
                    <p class="text-[10px] text-gray-400 mt-1">Boleh muat naik lebih daripada satu gambar untuk soalan kuiz.</p>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-semibold text-[11px] text-gray-500 mb-1">Pilihan A</label>
                        <input type="text" id="adm-kuiz-a" class="w-full border p-2 rounded-lg focus:outline-none">
                    </div>
                    <div>
                        <label class="block font-semibold text-[11px] text-gray-500 mb-1">Pilihan B</label>
                        <input type="text" id="adm-kuiz-b" class="w-full border p-2 rounded-lg focus:outline-none">
                    </div>
                    <div>
                        <label class="block font-semibold text-[11px] text-gray-500 mb-1">Pilihan C</label>
                        <input type="text" id="adm-kuiz-c" class="w-full border p-2 rounded-lg focus:outline-none">
                    </div>
                    <div>
                        <label class="block font-semibold text-[11px] text-gray-500 mb-1">Pilihan D</label>
                        <input type="text" id="adm-kuiz-d" class="w-full border p-2 rounded-lg focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block font-semibold text-gray-600 mb-1">Jawapan Betul (A / B / C / D)</label>
                    <input type="text" id="adm-kuiz-jawapan" placeholder="Contoh: A" class="w-full border p-2.5 rounded-lg focus:outline-none uppercase font-bold tracking-wider max-w-[100px]">
                </div>

                <div>
                    <label class="block font-semibold text-gray-600 mb-1">Penerangan Jawapan Kuiz</label>
                    <textarea id="adm-kuiz-penerangan" rows="2" class="w-full border p-2 rounded-lg focus:outline-none" placeholder="Terangkan kenapa jawapan ini betul..."></textarea>
                </div>
            </div>

            <button onclick="addContentToFirebase()" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-xl font-bold transition mt-4 shadow-md">
                <i class="fa-solid fa-cloud-arrow-up mr-2"></i> Muat Naik Kandungan
            </button>

            <div class="mt-6 border-t pt-4">
                <label class="block font-semibold text-red-600 mb-1 text-xs uppercase tracking-wider">Padam Isi Kandungan</label>
                <select id="adm-content-list-select" class="w-full border p-2 rounded-lg focus:outline-none text-xs bg-red-50 mb-2"></select>
                <button onclick="deleteSelectedContent()" class="w-full bg-red-500 hover:bg-red-600 text-white p-2 rounded-xl text-xs font-semibold transition">
                    <i class="fa-solid fa-trash mr-1"></i> Padam Kandungan Dipilih
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
        import { getDatabase, ref, set, push, get, child } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-database.js";
        import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-storage.js";

        // Firebase Configuration (Konfigurasi anda diletakkan di sini secara automatik)
        const firebaseConfig = {
                   apiKey: "AIzaSyCsFCvkBLuLHzUVGokE82jRWshbsTsavVI",
                   authDomain: "math-journey-2fd87.firebaseapp.com",
                   databaseURL: "https://math-journey-2fd87-default-rtdb.asia-southeast1.firebasedatabase.app",
                   projectId: "math-journey-2fd87",
                   storageBucket: "math-journey-2fd87.firebasestorage.app",
                   messagingSenderId: "543463983297",
                   appId: "1:543463983297:web:fb733a9457b5ca355aec40"
           };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);

        // Simpan data state silibus secara global
        let appSilibusData = {};

        // KELIMA: REPAIR FUNCTION toggleAdminContentFields()
        window.toggleAdminContentFields = function() {
            const type = document.getElementById('adm-content-type').value;

            document.getElementById('fields-nota').classList.add('hide');
            document.getElementById('fields-contoh').classList.add('hide');
            document.getElementById('fields-latihan').classList.add('hide');
            document.getElementById('fields-kuiz').classList.add('hide');

            const selectedField = document.getElementById(`fields-${type}`);
            if (selectedField) selectedField.classList.remove('hide');
        }

        // KEENAM: BUAT FUNCTION UPLOAD BANYAK GAMBAR
        async function uploadMultipleFilesHelper(fileElementId, folderName) {
            const fileEl = document.getElementById(fileElementId);
            if (!fileEl || !fileEl.files || fileEl.files.length === 0) return [];

            const urls = [];

            for (const file of fileEl.files) {
                if (!file.type.startsWith("image/")) {
                    throw new Error("Sila muat naik gambar sahaja.");
                }

                const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
                const storageRefPath = sRef(storage, `${folderName}/${Date.now()}_${safeName}`);
                const snapshot = await uploadBytes(storageRefPath, file);
                const downloadUrl = await getDownloadURL(snapshot.ref);
                urls.push(downloadUrl);
            }

            return urls;
        }

        // KETUJUH: REPAIR function addContentToFirebase() & KESEPULUH: RESET FORM
        window.addContentToFirebase = async function() {
            const formNum = document.getElementById('adm-form').value;
            const chKey = document.getElementById('adm-chapter-select').value;
            const subKey = document.getElementById('adm-subtopic-select').value;
            const type = document.getElementById('adm-content-type').value;

            if (!chKey || !subKey) {
                return alert("Sila pastikan Bab dan Subtopik telah dipilih!");
            }

            let finalDataObj = {
                type: type,
                createdAt: Date.now()
            };

            try {
                // Tunjukkan Loading State
                alert("Sedang memproses muat naik... Sila tunggu.");

                if (type === "nota") {
                    const uploadedUrls = await uploadMultipleFilesHelper("adm-nota-image-file", "nota_images");
                    finalDataObj.nota = {
                        maksud: document.getElementById("adm-nota-maksud").value,
                        formula: document.getElementById("adm-nota-formula").value,
                        kesilapan: document.getElementById("adm-nota-kesilapan").value,
                        tips: document.getElementById("adm-nota-tips").value,
                        imageUrls: uploadedUrls
                    };
                } 
                else if (type === "contoh") {
                    const uploadedUrls = await uploadMultipleFilesHelper("adm-contoh-image-file", "contoh_images");
                    finalDataObj.contoh = {
                        soalan: document.getElementById("adm-contoh-soalan").value,
                        langkah: document.getElementById("adm-contoh-langkah").value,
                        imageUrls: uploadedUrls
                    };
                } 
                else if (type === "latihan") {
                    const uploadedUrls = await uploadMultipleFilesHelper("adm-latihan-image-file", "latihan_images");
                    finalDataObj.latihan = {
                        soalan: document.getElementById("adm-latihan-soalan").value,
                        imageUrls: uploadedUrls,
                        a: document.getElementById("adm-latihan-a").value,
                        b: document.getElementById("adm-latihan-b").value,
                        c: document.getElementById("adm-latihan-c").value,
                        d: document.getElementById("adm-latihan-d").value,
                        jawapan: document.getElementById("adm-latihan-jawapan").value.toUpperCase().trim(),
                        penerangan: document.getElementById("adm-latihan-penerangan").value
                    };
                } 
                else if (type === "kuiz") {
                    const uploadedUrls = await uploadMultipleFilesHelper("adm-kuiz-image-file", "kuiz_images");
                    finalDataObj.kuiz = {
                        soalan: document.getElementById("adm-kuiz-soalan").value,
                        imageUrls: uploadedUrls,
                        a: document.getElementById("adm-kuiz-a").value,
                        b: document.getElementById("adm-kuiz-b").value,
                        c: document.getElementById("adm-kuiz-c").value,
                        d: document.getElementById("adm-kuiz-d").value,
                        jawapan: document.getElementById("adm-kuiz-jawapan").value.toUpperCase().trim(),
                        penerangan: document.getElementById("adm-kuiz-penerangan").value
                    };
                }

                // Push ke Firebase Realtime Database
                const listRef = ref(db, `silibus/${formNum}/${chKey}/subtopik/${subKey}/kandungan_list`);
                const newContentRef = push(listRef);
                await set(newContentRef, finalDataObj);

                alert("Kandungan berjaya dimuat naik dengan selamat!");

                // KESEPULUH: RESET FORM SELEPAS UPLOAD
                // Reset semua input bertaraf teks/textarea/fail
                const allInputs = document.querySelectorAll("#admin-panel-section input, #admin-panel-section textarea");
                allInputs.forEach(input => {
                    if (input.type === "file") {
                        input.value = "";
                    } else if (input.id !== "adm-content-type") {
                        input.value = "";
                    }
                });

                // Refresh Data Struktur Pilihan & Global State Silibus
                const snapshot = await get(ref(db, 'silibus'));
                appSilibusData = snapshot.exists() ? snapshot.val() : {};
                
                if (typeof window.loadSubtopicContentList === "function") {
                    window.loadSubtopicContentList();
                }

            } catch (error) {
                alert("Ralat berlaku semasa muat naik: " + error.message);
            }
        };

        // KELAPAN: PAPAR GAMBAR DI HALAMAN USER (HELPER GALLERY)
        window.renderImageGallery = function(imageUrls, oldImageUrl = "") {
            let urls = [];

            if (Array.isArray(imageUrls)) {
                urls = urls.concat(imageUrls);
            }

            if (oldImageUrl && typeof oldImageUrl === "string") {
                const lower = oldImageUrl.toLowerCase();
                const isPdf = lower.includes(".pdf") || lower.includes("pdf?");
                if (!isPdf) urls.push(oldImageUrl);
            }

            if (urls.length === 0) return "";

            return `
                <div class="space-y-2 mt-3">
                    \${urls.map(url => `<img src="\${url}" class="w-full h-auto object-contain rounded-xl border bg-white shadow-sm">`).join("")}
                </div>
            `;
        }

        // CONTOH IMPLEMENTASI RENDER KANDUNGAN USER (INTEGRASI KELAPAN)
        window.renderUserContent = function(item) {
            let outputHtml = "";
            
            if (item.type === "nota" && item.nota) {
                outputHtml += `
                    <div class="bg-amber-50 p-4 rounded-2xl border border-amber-200">
                        <p><b>Maksud:</b> \${item.nota.maksud || "-"}</p>
                        <p><b>Formula:</b> \${item.nota.formula || "-"}</p>
                        \${window.renderImageGallery(item.nota.imageUrls, item.nota.imageUrl)}
                    </div>
                `;
            } 
            else if (item.type === "contoh" && item.contoh) {
                outputHtml += `
                    <div class="bg-blue-50 p-4 rounded-2xl border border-blue-200">
                        <p class="font-bold">Soalan:</p>
                        <p>\${item.contoh.soalan}</p>
                        \${window.renderImageGallery(item.contoh.imageUrls, item.contoh.imageUrl)}
                        <p class="mt-2 font-bold text-green-700">Langkah Penyelesaian:</p>
                        <p class="whitespace-pre-line">\${item.contoh.langkah}</p>
                    </div>
                `;
            }
            else if (item.type === "latihan" && item.latihan) {
                outputHtml += `
                    <div class="bg-purple-50 p-4 rounded-2xl border border-purple-200">
                        <p class="font-bold">Soalan Latihan:</p>
                        <p>\${item.latihan.soalan}</p>
                        \${window.renderImageGallery(item.latihan.imageUrls, item.latihan.imageUrl)}
                        <div class="mt-3 space-y-1 text-sm">
                            <div><b>A:</b> \${item.latihan.a}</div>
                            <div><b>B:</b> \${item.latihan.b}</div>
                            <div><b>C:</b> \${item.latihan.c}</div>
                            <div><b>D:</b> \${item.latihan.d}</div>
                        </div>
                    </div>
                `;
            }

            return outputHtml;
        };

        // KESEMBILAN: REPAIR KUIZ BAB SUPAYA GUNA DATA TYPE kuiz SAHAJA
        window.startChapterQuiz = function(subtopikObj) {
            let allQuizQuestions = [];

            if (subtopikObj && typeof subtopikObj === 'object') {
                Object.values(subtopikObj).forEach(sub => {
                    if (sub.kandungan_list) {
                        Object.values(sub.kandungan_list).forEach(item => {
                            // Mengambil item yang type === "kuiz" dan mempunyai data objek kuiz sahaja
                            if (item.type === "kuiz" && item.kuiz) {
                                allQuizQuestions.push(item.kuiz);
                            }
                        });
                    }
                });
            }

            if (allQuizQuestions.length === 0) {
                return alert("Tiada soalan kuiz bab dimasukkan lagi.");
            }

            // Teruskan logik pemula kuiz asal anda menggunakan allQuizQuestions
            console.log("Kuiz bermula dengan soalan rasmi:", allQuizQuestions);
            // Sila panggil renderActiveQuizQuestion() anda di sini
        };

        // Contoh fungsi pembantu paparan soalan aktif kuiz (Untuk Rujukan Halaman Kuiz)
        window.renderActiveQuizQuestion = function(activeKuizItem) {
            // Logik paparan imej kuiz mengikut jumlah gambar yang dimuat naik
            let quizImageArea = window.renderImageGallery(activeKuizItem.imageUrls, activeKuizItem.imageUrl);
            
            let htmlStr = `
                <div class="quiz-box bg-white p-4 rounded-2xl border shadow-sm">
                    <p class="font-bold text-lg">\${activeKuizItem.soalan}</p>
                    \${quizImageArea}
                    </div>
            `;
            return htmlStr;
        };

        // Logik padam sedia ada yang disegerakan
        window.deleteSelectedContent = function() {
            const formNum = document.getElementById('adm-form').value;
            const chKey = document.getElementById('adm-chapter-select').value;
            const subKey = document.getElementById('adm-subtopic-select').value;
            const contentKey = document.getElementById('adm-content-list-select').value;

            if(!chKey || !subKey || !contentKey) return alert("Sila pilih isi kandungan sedia ada yang mahu dipadam dari dropdown.");

            if (confirm("Adakah anda pasti mahu memadam isi kandungan ini sahaja?")) {
                set(ref(db, `silibus/\${formNum}/\${chKey}/subtopik/\${subKey}/kandungan_list/\${contentKey}`), null)
                .then(() => {
                    alert("Kandungan tersebut berjaya dipadamkan!");
                    get(ref(db, 'silibus')).then((snapshot) => {
                        appSilibusData = snapshot.exists() ? snapshot.val() : {};
                        if(typeof window.loadSubtopicContentList === 'function') window.loadSubtopicContentList();
                    });
                }).catch(e => alert(e.message));
            }
        };

    </script>
</body>
</html>
